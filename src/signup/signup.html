<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
    <!--Google Font - Inter-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!--Google Font - Instrument Sans-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body class="secondary-purple">
    <div class="row">
        <div class="main big_thing Inter">
            <span class="welcome">Get Started!</span>
            <span class="mid_text">Email Address</span>
            <input class="textbox" type="" placeholder="Enter your email">
            <span class="mid_text">Password</span>
            <input class="textbox" type="text" placeholder="Set up a password!">
            <button class="sign_up strong-purple white">Sign Up</button>
            <div class="divider-grid">
                <span>OR</span>
            </div>
            <button class="login_guest weak-purple black">Login as a guest</button>
            <span class="black bottom_line">Already have an account? <a class="strong_purple bottom_line" href="">Login here</a></span>
        </div>
        <div class="big_thing">
            <img src="" alt="some beautiful images">
        </div>
    </div>
</body>
<script src="signup.js" type="module"></script>
</html>
